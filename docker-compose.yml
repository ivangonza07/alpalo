services:
  db:
    image: postgres:17
    container_name: alpalo-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - alpalo-db-data:/var/lib/postgresql/data

volumes:
  alpalo-db-data:
